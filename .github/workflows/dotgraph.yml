name: Bundled DOT rendering on Windows, Linux, and macOS

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Test bundled renderer without installing Graphviz
        run: dotnet test source/Lite.StateMachine.DotGraph.Tests -c Release --filter TestCategory!=ExternalGraphviz
      - name: Test restored NuGet package with an empty PATH
        shell: pwsh
        run: ./scripts/Test-DotGraphPackage.ps1
      - name: Test sample console and PowerShell entry points
        shell: pwsh
        run: |
          dotnet run --project samples/Sample11.GenerateDotGraph -c Release -f net10.0 -- ./output/ci-sample11
          if ($LASTEXITCODE -ne 0) { throw 'Console sample failed.' }
          ./samples/Sample11.GenerateDotGraph/Generate-Diagrams.ps1 -SkipBuild -OutputDirectory ./output/ci-sample11-powershell
